server.servlet.context-path=/api
spring.application.name=solicitation-service
spring.profiles.active=dev

# PostgreSQL Datasource
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Elasticsearch
spring.elasticsearch.uris=${ELASTICSEARCH_HOST}
spring.elasticsearch.connection-timeout=3s
spring.elasticsearch.socket-timeout=10s

# JWT Security Settings
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION}

# ViaCEP Client
via-cep.base-url=https://viacep.com.br/ws

# ADMIN
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}
